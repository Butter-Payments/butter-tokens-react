
name: Trigger Semgrep Scan Workflow

on:
  push:
    branches:
      - '**' 
  pull_request:
    branches:
      - '**'  

jobs:
  trigger-semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger Semgrep Scan Workflow
        uses: actions/github-script@v6
        with:
          script: |
            const { data: workflow } = await github.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'security-workflows/.github/workflows/semgrep-sast.yml', 
              ref: context.ref, 
            });
